name: Next.js CI/CD Pipeline

on:
  # push:
  #   branches: [ "main" ]
  # pull_request:
  #   branches: [ "main" ]
  workflow_dispatch: # Enables the "Run workflow" button in the GitHub UI

# Applies to the entire workflow
defaults:
  run:
    working-directory: ./frontend  # Set the working directory to the frontend folder for all steps

env:
  PROJECT_ID: movie-match-d665d
  REPOSITORY: movie-app
  IMAGE_NAME: movie-match

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    # Step 1: Fetch code from your repository
    - name: Checkout repository
      uses: actions/checkout@v7

    # Step 2: Set up Node.js environment
    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: 'npm'       # Automatically caches global npm dependencies
        cache-dependency-path: frontend/package-lock.json  # Cache based on package-lock.json

    # Step 3: Install clean dependencies
    - name: Install Dependencies
      run: npm ci

    # Step 4: Build the application
    - name: Build Project
      run: npm run build


  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # 1. Authenticate Docker to Google Artifact Registry
      - name: Log in to Google Artifact Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.GAR_LOCATION }}-docker.pkg.dev
          username: _json_key
          password: ${{ secrets.GAR_JSON_KEY }}

      # 2. Set up Docker Buildx for faster, cached builds
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. Generate Docker tags
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=v1.1-