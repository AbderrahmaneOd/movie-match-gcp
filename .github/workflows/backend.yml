  build-and-deploy:
    # needs: test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # 1. Authenticate Docker to Google Artifact Registry
      - name: Log in to Google Artifact Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ vars.GAR_LOCATION }}-docker.pkg.dev
          username: _json_key
          password: ${{ secrets.GAR_JSON_KEY }}

      # 2. Set up Docker Buildx for faster, cached builds
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # 3. Generate Docker tags
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ vars.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=v1.1-

      # 3. Build and Push the image
      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Use GitHub Actions cache to speed up future builds
          cache-from: type=gha
          cache-to: type=gha,mode=max